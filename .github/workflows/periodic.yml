name: Periodic

on:
  workflow_dispatch:
  schedule:
  - cron: "19 6 * * 1"

jobs:
  check_date:
    runs-on: ubuntu-latest
    name: Check latest commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
      - name: print latest_commit
        run: echo ${{ github.sha }}

      - id: should_run
        continue-on-error: true
        name: check latest commit is less than a day
        if: ${{ github.event_name == 'schedule' }}
        run: test -z $(git rev-list  --after="7 days"  ${{ github.sha }}) && echo "::set-output name=should_run::false"

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Cache Nix store
      uses: actions/cache@v6
      with:
        path: /nix
        key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
        restore-keys: nix-${{ runner.os }}-

    - name: Update flake inputs (nixpkgs, GHC, Haskell packages)
      run: |
        nix flake update
        git diff --stat flake.lock

    - name: Build & Test against updated inputs
      run: nix develop --command cabal test --test-show-details=streaming

  docker:
    runs-on: ubuntu-latest
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run != 'false' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ secrets.DOCKER_USERNAME }}/gopro:latest
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/gopro:cache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/gopro:cache,mode=max    